name: Witness container

on:
  push:
    branches: [main]
    tags: ["witness-v*"]
    paths:
      - "package.json"
      - "bun.lock"
      - "witness/**"
      - ".github/workflows/witness-container.yml"
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - "witness/**"
      - ".github/workflows/witness-container.yml"

env:
  BUN_VERSION: 1.3.14
  IMAGE_NAME: ghcr.io/absolutejs/vulnerabilities-witness

jobs:
  validate:
    name: Validate witness package and image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install the locked workspace
        run: bun install --frozen-lockfile

      - name: Run the complete witness package gate
        run: |
          bun run --filter @absolutejs/vulnerabilities-witness check:package
          git diff --exit-code

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the local scan target
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./witness
          load: true
          platforms: linux/amd64
          pull: true
          push: false
          tags: local/absolutejs-vulnerabilities-witness:${{ github.sha }}
          cache-from: type=gha,scope=witness
          cache-to: type=gha,mode=max,scope=witness

      - name: Generate the SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: local/absolutejs-vulnerabilities-witness:${{ github.sha }}
          format: spdx-json
          output-file: evidence/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Fail on high or critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: local/absolutejs-vulnerabilities-witness:${{ github.sha }}
          fail-build: true
          output-format: json
          severity-cutoff: high

  publish:
    name: Publish signed immutable witness image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install the locked workspace
        run: bun install --frozen-lockfile

      - name: Run the complete witness package gate
        run: |
          bun run --filter @absolutejs/vulnerabilities-witness check:package
          git diff --exit-code

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the local scan target
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./witness
          load: true
          platforms: linux/amd64
          pull: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=witness
          cache-to: type=gha,mode=max,scope=witness

      - name: Prepare the evidence directory
        run: mkdir -p evidence

      - name: Generate the SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: evidence/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Fail on high or critical vulnerabilities
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          fail-build: true
          output-format: json
          severity-cutoff: high

      - name: Stage the vulnerability report
        run: cp "${{ steps.scan.outputs.json }}" evidence/grype.json

      - name: Log in to GHCR after validation
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push only the immutable full-revision tag
        run: docker push "$IMAGE_NAME:$GITHUB_SHA"

      - name: Resolve the published digest
        id: image
        run: |
          reference="$({
            docker image inspect \
              --format '{{json .RepoDigests}}' \
              "$IMAGE_NAME:$GITHUB_SHA"
          } | jq -er \
            --arg prefix "$IMAGE_NAME@sha256:" \
            '[.[] | select(startswith($prefix))] |
            if length == 1 then .[0]
            else error("expected one published digest") end')"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$reference" > evidence/image-reference.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Generate exact-source SLSA provenance
        run: ./node_modules/.bin/absolute-attest provenance evidence/provenance.json

      - name: Attest, sign, and immediately verify the published digest
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          ./node_modules/.bin/absolute-attest publish-image \
            "$IMAGE_REFERENCE" \
            evidence/provenance.json \
            evidence/sbom.spdx.json \
            evidence/attestations.json

      - name: Retain immutable publication evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: witness-image-${{ github.sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 90
